name: Update profile README

on:
  schedule:
    - cron: "23 2 * * *"   # tiap hari 02:23 UTC (09:23 WIB)
  workflow_dispatch:         # bisa dijalankan manual dari tab Actions
  push:
    branches: [main]
    paths: [profile.json, build.py, .github/workflows/profile.yml]

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build assets, calendar and README
        env:
          # PROFILE_TOKEN (opsional) = personal access token agar kontribusi privat ikut dihitung.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 build.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "chore: update contribution calendar"
            git push
          fi
