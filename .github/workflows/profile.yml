name: Update profile README

# Kalender kontribusi disajikan live dari Vercel (lihat calendar_url di profile.json),
# jadi workflow ini cukup jalan saat data/desain profil berubah: tanpa jadwal harian.
on:
  workflow_dispatch:         # bisa dijalankan manual dari tab Actions
  push:
    branches: [main]
    paths: [profile.json, build.py, sketch.py, src/**, requirements.txt, .github/workflows/profile.yml]

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install font tools
        run: pip install -r requirements.txt

      - name: Build assets and README
        env:
          # PROFILE_TOKEN (opsional) = personal access token agar kontribusi privat ikut dihitung.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 build.py

      - name: Commit if changed
        run: |
          # commit atas nama pemilik repo, supaya bot tidak muncul di daftar Contributors
          git config user.name "Ilham Fauzi"
          git config user.email "122434192+amamFz@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "Rebuild profile assets from profile.json"
            git push
          fi
