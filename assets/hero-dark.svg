  <text x="68" y="186" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="3" fill="#e6edf3">ILHAM FAUZI</text>
  <rect x="72" y="208" width="320" height="5" rx="2.5" fill="url(#bar)"/>
