<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="ILHAM FAUZI — Front-End Developer · UI/UX Designer">
  <title>ILHAM FAUZI — Front-End Developer · UI/UX Designer</title>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#30363d"/>
